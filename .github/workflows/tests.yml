name: FluPop software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'snakemake==9.27.0' -e .
      - run: python -m unittest discover -s tests -v
      - run: snakemake -s workflow/Snakefile --cores 1 --rerun-incomplete
      - uses: actions/upload-artifact@v4
        with:
          name: flupop-synthetic-report
          path: results/DEMO
