[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flupop"
version = "0.1.0a1"
description = "FluPop supplied-record validation and reporting workflow"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
flupop-stage = "flupop.stage:main"

[tool.setuptools.packages.find]
where = ["src"]
